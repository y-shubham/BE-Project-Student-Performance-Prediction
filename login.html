<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — AI Performance Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen grid place-items-center p-6">
    <div class="w-full max-w-md bg-slate-900/60 backdrop-blur rounded-2xl p-6 shadow-xl border border-slate-800">
        <div class="flex items-center gap-3 mb-4">
            <div class="h-10 w-10 rounded-xl bg-sky-500/20 grid place-items-center">🎓</div>
            <h1 class="text-2xl font-semibold tracking-tight">Sign in</h1>
        </div>

        <div class="space-y-3 mb-4">
            <label class="text-sm text-slate-300">Role</label>
            <select id="mode"
                class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-600">
                <option value="student">Student</option>
                <option value="mentor">Mentor</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <!-- Student -->
        <div id="studentBlock" class="space-y-3 mb-3">
            <div>
                <label class="text-sm text-slate-300">Student ID</label>
                <input id="studentId"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-600"
                    placeholder="e.g. S1001" />
            </div>
            <div>
                <label class="text-sm text-slate-300">Password</label>
                <input id="studentPassword" type="password"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-600"
                    placeholder="mentor123" />
            </div>
        </div>

        <!-- Mentor -->
        <div id="mentorBlock" class="space-y-3 mb-3 hidden">
            <div>
                <label class="text-sm text-slate-300">Mentor Username</label>
                <input id="mentorUsername"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-600"
                    placeholder="mentor-computer-science" />
            </div>
            <div>
                <label class="text-sm text-slate-300">Password</label>
                <input id="mentorPassword" type="password"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-600"
                    placeholder="mentor123" />
            </div>
            <p class="text-xs text-slate-400">Tip: Department slug is derived from the name (e.g., “Computer Science” →
                <code>computer-science</code>).</p>
        </div>

        <!-- Admin -->
        <div id="adminBlock" class="space-y-3 mb-3 hidden">
            <div>
                <label class="text-sm text-slate-300">Admin Username</label>
                <input id="adminUsername"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-600"
                    placeholder="admin" />
            </div>
            <div>
                <label class="text-sm text-slate-300">Password</label>
                <input id="adminPassword" type="password"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-600"
                    placeholder="admin123" />
            </div>
        </div>

        <button id="loginBtn"
            class="w-full bg-sky-600 hover:bg-sky-500 rounded-xl py-2.5 font-semibold transition-colors">Sign
            in</button>

        <p class="text-xs text-slate-400 mt-4 leading-5">
            Demo creds:<br>
            • <b>Student</b> → any valid <code>Student_ID</code> with password <code>hello{Student_ID}</code><br>
            • <b>Mentor</b> → username <code>mentor-{dept-slug}</code> with password <code>{DepartmentName}123</code><br>
            • <b>Admin</b> → <code>admin</code> / <code>admin123</code>
        </p>

        <p id="err" class="hidden mt-3 text-sm text-rose-400"></p>
    </div>

    <script>
        const modeSel = document.getElementById('mode');
        const studentBlock = document.getElementById('studentBlock');
        const mentorBlock = document.getElementById('mentorBlock');
        const adminBlock = document.getElementById('adminBlock');
        const errEl = document.getElementById('err');

        function setBlocks() {
            const m = modeSel.value;
            studentBlock.classList.toggle('hidden', m !== 'student');
            mentorBlock.classList.toggle('hidden', m !== 'mentor');
            adminBlock.classList.toggle('hidden', m !== 'admin');
            errEl.classList.add('hidden');
        }
        setBlocks();
        modeSel.onchange = setBlocks;

        document.getElementById('loginBtn').onclick = async () => {
            errEl.classList.add('hidden');
            const mode = modeSel.value;
            let payload = { mode };

            if (mode === 'student') {
                payload.student_id = document.getElementById('studentId').value.trim();
                payload.password = document.getElementById('studentPassword').value;
            } else if (mode === 'mentor') {
                payload.username = document.getElementById('mentorUsername').value.trim();
                payload.password = document.getElementById('mentorPassword').value;
            } else {
                payload.username = document.getElementById('adminUsername').value.trim();
                payload.password = document.getElementById('adminPassword').value;
            }

            try {
                const r = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const d = await r.json();
                if (!r.ok) throw new Error(d.error || 'Login failed');
                localStorage.setItem('token', d.access_token);
                window.location = '/';
            } catch (e) {
                errEl.textContent = e.message;
                errEl.classList.remove('hidden');
            }
        };
    </script>
</body>

</html>
